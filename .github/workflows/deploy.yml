    #     publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # Configure this secret in GitHub if using this step
    #     images: 'testdockersuraj.azurecr.io/studentperformance-v1:${{ github.sha }}'