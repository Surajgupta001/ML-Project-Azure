name: Deploy to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: testdockersuraj.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Image
      run: |
        docker build -t testdockersuraj.azurecr.io/studentperformance-v1:${{ github.sha }} -t testdockersuraj.azurecr.io/studentperformance-v1:latest .

    - name: Push Image
      run: |
        docker push testdockersuraj.azurecr.io/studentperformance-v1:${{ github.sha }}
        docker push testdockersuraj.azurecr.io/studentperformance-v1:latest

    # OPTIONAL: Uncomment the section below if you want GitHub Actions to automatically trigger 
    # the deployment to your Azure Web App (App Service) instead of using Azure's internal CD webhook.
    # - name: Deploy to Azure Web App
    #   uses: azure/webapps-deploy@v3
